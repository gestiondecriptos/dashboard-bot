sl=fl.map(x=>+x.slippage_vs_ref_hl_pct).filter(x=>!isNaN(x)),fee=fl.reduce((p,x)=>p+(+x.fee||0),0),act={},dly=dl.map(x=>+x.cron_delay_min).filter(x=>!isNaN(x));
(D.rulesAll||[]).forEach(r=>{if(r.status=="activada")act[r.signal_date]=(act[r.signal_date]||0)+1});
const al=[late?`⚠️ Falta el ciclo del ${exp}`:"",chk>6?`⚠️ Fills sin comprobar desde hace ${f(chk,1)} h`:"",...(k.warnings||[]).map(w=>"⚠️ "+w)].filter(Boolean),
er=e.last_error?`${e.last_error.utc} · ${e.last_error.where||""} · ${e.last_error.type}: ${why(e.last_error.msg)}`:"Sin errores";
const rows=dl.slice().reverse().map(x=>({a:x.signal_date,b:(x.run_utc||"").replace("T"," ").slice(0,16),c:x.cron_delay_min,d:x.n_orders,e:act[x.signal_date]||0}));
return`<div class="grid">${cd("Spread libro",L.book_spread_pct?f(L.book_spread_pct,4)+" %":"–")}${cd("Profundidad ±1 % (compra / venta)",L.book_depth_bid_1pct_usdc?"$ "+f(L.book_depth_bid_1pct_usdc,0)+" / "+f(L.book_depth_ask_1pct_usdc,0):"–")}${cd("HL vs fuente (cierre)",L.diff_hl_vs_src_pct?f(L.diff_hl_vs_src_pct,4)+" %":"–")}${cd("Retraso cron (último / medio)",dly.length?f(dly[dly.length-1],0)+" / "+f(mean(dly),0)+" min":"–")}
${cd("Órdenes llenadas",ok.length?f(fl.length/ok.length*100,0)+" % ("+fl.length+"/"+ok.length+")":"–")}${cd("Slippage medio vs ref. HL",sl.length?f(mean(sl),3)+" %":"–")}${cd("Comisiones (USDC)",fl.length?f(fee,4):"–")}${cd("Órdenes abiertas",e.open_orders??st.resting??0)}${cd("Última comprobación de fills",chk==null?"–":"hace "+f(chk,1)+" h")}</div>
<div class="card">Órdenes por estado: ${Object.entries(st).map(([a,b])=>`<span class="chip ${a}">${a}: ${b}</span>`).join("")||"–"}<br>${al.join("<br>")}${al.length?"<br>":""}Último error: ${esc(er)}</div>
<div class="row"><div class="card"><small>Spread del libro y diferencia HL vs fuente (%)</small><div id="c5" class="ch"></div></div><div class="card"><small>Retraso del cron vs 00:07 UTC (min)</small><div id="c6" class="ch"></div></div></div>
<h3>Ciclos diarios</h3>${tbl(rows,["a","b","c","d","e"],["Fecha señal","Ejecución (UTC)","Retraso (min)","Órdenes","Reglas activadas"])}`}
function chartE(){const dl=D.daily||[],x=dl.map(s=>s.signal_date),mk=(id,o)=>{const c=echarts.init($(id));c.setOption({grid:{left:50,right:15,top:30,bottom:30},tooltip:{trigger:"axis"},legend:{textStyle:{color:"#8b90ad"}},xAxis:{type:"category",data:x},yAxis:{type:"value",scale:true},...o});return c};
charts=[mk("#c5",{series:[["Spread libro %","book_spread_pct","#2fd08a"],["HL vs fuente %","diff_hl_vs_src_pct","#f5b942"]].map(a=>({name:a[0],type:"line",symbolSize:8,color:a[2],data:dl.map(s=>s[a[1]]===""?null:+s[a[1]])}))}),mk("#c6",{series:[{name:"Retraso cron (min)",type:"bar",color:"#9339f4",data:dl.map(s=>+s.cron_delay_min)}]})]}
function chartR(){const cut=rng?Date.now()-rng*864e5:0,d=daily().filter(s=>+s.share_px>0&&+new Date(s.t)>=cut);if(!d.length)return;const b=d[0],c=echarts.init($("#c3"));
c.setOption({legend:{textStyle:{color:"#8b90ad"}},grid:{left:50,right:15,top:30,bottom:30},tooltip:{trigger:"axis"},xAxis:{type:"category",data:d.map(s=>s.t.slice(0,10))},yAxis:{type:"value",scale:true},
series:[["Participación","share_px","#9339f4"],["BTC","btc_px","#f5b942"]].map(a=>({name:a[0],type:"line",showSymbol:false,color:a[2],data:d.map(s=>+(s[a[1]]/b[a[1]]*100).toFixed(2))}))});charts=[c]}
function chartA(){const c=echarts.init($("#c4"));c.setOption({tooltip:{},series:[{type:"pie",radius:["45%","70%"],label:{color:"#e6e8f2"},data:holders().filter(h=>h.participaciones>0).map(h=>({name:h.alias,value:h.participaciones}))}]});charts=[c]}
function shell(){$("#tabs").innerHTML=["Inicio","Rendimiento","Accionistas","Operaciones","Ejecución","Reglas","Métricas"].map(t=>`<button class="${t==tab?"on":""}" onclick="tab='${t}';shell();draw()">${t}</button>`).join("");
$("#rng").innerHTML=[[7,"7d"],[30,"30d"],[90,"90d"],[365,"1a"],[0,"Todo"]].map(a=>`<button class="${a[0]==rng?"on":""}" onclick="rng=${a[0]};shell();draw()">${a[1]}</button>`).join(" ")}
$("#cur").onclick=()=>{cur=cur=="USD"?"BTC":"USD";$("#cur").textContent=cur;draw()};
load().then(()=>{const e=D.est||{},m=!e.network||e.network=="mainnet";$("#net").className="badge "+(m?"net-m":"net-t");$("#net").textContent=m?"🔴 MAINNET":"🧪 "+e.network.toUpperCase();$("#pair").textContent=e.pair||(e.network?"":"· bot sin datos publicados (testnet)");if(D.demo)$("#demo").classList.remove("hide");shell();draw()});
addEventListener("resize",()=>charts.forEach(c=>c.resize()));
</script></body></html>
