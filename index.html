<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard Bot BTC · Hyperliquid</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
:root{--bg:#11131f;--c:#1d1f31;--b:#2d3048;--t:#e6e8f2;--m:#8b90ad;--p:#9339f4;--g:#2fd08a;--r:#ef5b6b;--a:#f5b942}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--b)}
h1{font-size:17px;margin:0 8px 0 0}.tabs{display:flex;gap:4px;flex-wrap:wrap}
button{background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:6px 12px;cursor:pointer}
button.on{background:var(--p);border-color:var(--p)}main{padding:16px;max-width:1200px;margin:auto}
.badge{padding:3px 9px;border-radius:12px;font-weight:600;font-size:12px}.net-t{background:#3a3320;color:var(--a)}.net-m{background:#3a1f26;color:var(--r)}
.demo{background:#2a2350;color:#cdb8ff;text-align:center;padding:6px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px}.card small{color:var(--m)}
.big{font-size:22px;font-weight:700;margin-top:4px}.row{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:800px){.row{grid-template-columns:1fr}}.ch{height:300px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}
th{color:var(--m)}.sc{overflow-x:auto}.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;margin:2px}
.Compra,.activada,.filled{background:#17402f;color:var(--g)}.Venta{background:#47202a;color:var(--r)}.Vigilar,.vigilar,.resting{background:#463a17;color:var(--a)}
.Neutral,.nocumplida{background:#2a2d44;color:var(--m)}.error,.err,.suprimida{background:#47202a;color:var(--r)}
iframe{width:100%;height:80vh;border:1px solid var(--b);border-radius:10px;background:#fff}.hide{display:none}h3{margin:18px 0 8px}
</style></head><body>
<div id="demo" class="demo hide">🧪 DATOS DE DEMOSTRACIÓN — no son reales. Se sustituyen solos cuando existan datos en /data.</div>
<header><h1>🤖 Bot BTC · Hyperliquid</h1><span id="net" class="badge"></span><span id="pair" style="color:var(--m)"></span>
<div class="tabs" id="tabs"></div><span style="flex:1"></span>
<button id="cur">USD</button><span id="rng"></span></header>
<main id="main"></main>
<script>
const CFG={METRICAS_URL:"https://gestiondecriptos.github.io/metricas-bitcoin/"};   // <-- URL de la web de métricas
const $=s=>document.querySelector(s),f=(x,d=2)=>x==null||x===""||isNaN(x)?"–":(+x).toLocaleString("es-ES",{maximumFractionDigits:d,minimumFractionDigits:d});
function parse(t){const R=[];let r=[],c="",q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==","){r.push(c);c=""}else if(h=="\n"){r.push(c);R.push(r);r=[];c=""}else if(h!="\r")c+=h}
if(c||r.length){r.push(c);R.push(r)}const H=R.shift()||[];return R.filter(x=>x.length==H.length).map(x=>Object.fromEntries(H.map((k,i)=>[k,x[i]])))}
const get=async(u,j)=>{try{const r=await fetch(u+"?"+Date.now());if(!r.ok)return null;return j?await r.json():parse(await r.text())}catch(e){return null}};
let D={},tab="Inicio",cur="USD",rng=90,charts=[];
function demo(){const d=demo0(),n=Date.now(),iso=k=>new Date(n-k*864e5).toISOString();
d.S.forEach(s=>{s.shares=1762;s.share_px=+s.nav_usd/1762;s.btc_total=+s.nav_usd/+s.btc_px*.6;s.usdc_total=+s.nav_usd*.4;s.debt_usd=0});
d.ops=[[200,"BUY","B4_EMA200W"],[150,"BUY","B1_RSI+FNG"],[120,"SELL","S1_FNG"],[60,"BUY","B3_MVRV"],[40,"SELL","S3_MVRV"],[3,"BUY","B2_RSI"]].map(a=>({signal_date:iso(a[0]).slice(0,10),rule:a[2],side:a[1],status:"filled",size_usdc:45,qty:5e-4,px:60000,avg_px:55000+a[0]*40,filled_qty:5e-4,fill_time_utc:iso(a[0]),slippage_vs_ref_hl_pct:.05,fee:3e-7}));
d.flows=[[250,"a:0","aporte",150,.1,1500,1500],[120,"b:0","aporte",50,.12,416,1916],[30,"c:0","retirada",-20,.13,-154,1762]].map(a=>({t:iso(a[0]),tx:a[1],tipo:a[2],usdc:a[3],precio_participacion:a[4],participaciones:a[5],participaciones_total:a[6]}));
d.acc={alias_por_defecto:"Fondo",asignaciones:{"b:0":"Socio B"}};return d}
function demo0(){const S=[];let btc=60000,sh=1000,nav=1000;const n=Date.now();for(let i=300;i>=0;i--){btc*=1+Math.sin(i/9)*0.012+0.001;nav=nav*1+(btc/60000-1)*3+2;S.push({t:new Date(n-i*864e5).toISOString(),btc_px:btc,w2_usd:null,w3_usd:nav*.55,w4_usd:null,nav_usd:nav*.55,shares:1000,share_px:nav*.55/1000})}
const ind={"RSI-14":{valor:24.9,estado:"Compra"},"Fear & Greed":{valor:11,estado:"Compra"},"MVRV":{valor:1.15,estado:"Vigilar"},"Cierre / EMA-200W":{valor:.86,estado:"Compra"}};
const rl=[["B1_RSI+FNG","activada","RSI 24.9 · F&G 11",-17,"filled",""],["B2_RSI","no aplica","B1 ya activa",-17,"",""],["B3_MVRV","vigilar","MVRV 1.15 (<1.1)",4.5,"",""],["B4_EMA200W","activada","cierre vs EMA",-14,"resting",""],["B5_SIN_COMPRAS","no cumplida","1 d sin operar",96,"",""],["B6_CAIDA_ULT_COMPRA","no cumplida","sin compras previas",null,"",""],["S1_FNG","no cumplida","F&G 11 (>80)",86,"",""],["S3_MVRV","no cumplida","MVRV 1.15 (>2.4)",52,"",""],["S4_EMA200W","no cumplida","cierre vs 2×EMA",57,"",""]].map(a=>({signal_date:"2026-12-01",rule:a[0],status:a[1],detail:a[2],dist_pct:a[3],decision:a[4],reason:a[5],cooldown_rest_d:0}));
return{demo:1,S,est:{network:"mainnet",pair:"UBTC/USDC",last_cycle:{signal_date:"2026-12-01",cron_delay_min:42,ok:true,n_orders:2},balances:{usdc_free:412.3,base_free:.0061},indicators:ind,last_error:null,updated_utc:new Date().toISOString()},
ops:[{signal_date:"2026-12-01",rule:"B1_RSI+FNG",side:"BUY",status:"filled",size_usdc:45,qty:.00075,px:60600,avg_px:60010,slippage_vs_ref_hl_pct:.05,fee:3e-7},{signal_date:"2026-12-01",rule:"B4_EMA200W",side:"BUY",status:"resting",size_usdc:31.5,qty:.00053,px:59400,avg_px:"",slippage_vs_ref_hl_pct:"",fee:""}],
fills:[{signal_date:"2026-12-01",rule:"B1_RSI+FNG",fill_n:1,fill_time_utc:"2026-12-02T00:08:11",qty:.00075,px:60010,fee:3e-7}],rules:rl}}
async function load(){const S=await get("data/snapshots.csv");if(!S||!S.length){D=demo();return}
D={S,est:await get("data/bot/estado_bot.json",1)||{},ops:await get("data/bot/historial_operaciones.csv")||[],fills:await get("data/bot/historial_fills.csv")||[],rules:(await get("data/bot/historial_reglas.csv")||[]),flows:await get("data/flujos.csv")||[],acc:await get("data/accionistas.json",1)||{}};
const l=D.rules.map(r=>r.signal_date).sort().pop();D.rules=D.rules.filter(r=>r.signal_date==l)}
function tbl(rows,cols){if(!rows.length)return'<div class="card"><small>Sin datos todavía.</small></div>';
return`<div class="card sc"><table><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr>${rows.map(r=>`<tr>${cols.map(c=>{const v=r[c];const k=(c=="status"||c=="decision")&&v?`<span class="chip ${String(v).replace(/ /g,"")}">${v}</span>`:(isNaN(v)||v===""||v==null?(v??""):f(v,6).replace(/,?0+$/,""));return`<td>${k}</td>`}).join("")}</tr>`).join("")}</table></div>`}
function series(){const m=cur=="USD"?1:0,cut=rng?Date.now()-rng*864e5:0;return D.S.filter(s=>+new Date(s.t)>=cut&&+s.share_px>0).map(s=>[s.t,cur=="USD"?+s.nav_usd:+s.nav_usd/+s.btc_px,+s.share_px])}
function draw(){charts.forEach(c=>c.dispose());charts=[];const L=D.S[D.S.length-1],e=D.est||{},k=e.last_cycle||{};const ser=series(),sp=cur=="USD"?1:null;
const cards=[["NAV",cur=="USD"?"$ "+f(L.nav_usd):"₿ "+f(L.nav_usd/L.btc_px,6)],["Precio participación",L.share_px?"$ "+f(L.share_px,4):"pendiente"],["Participaciones",L.shares?f(L.shares,0):"pendiente"],["BTC (precio)","$ "+f(L.btc_px,0)],["BTC total (W2+W3)",f(L.btc_total,6)],["USDC total (equiv.)",f(L.usdc_total)],["Deuda Aave","$ "+f(L.debt_usd)],["Último ciclo",k.signal_date?k.signal_date+(k.ok?" ✅":" ⚠️"):"–"],["Retraso cron",k.cron_delay_min!=null?f(k.cron_delay_min,0)+" min":"–"]];
const ind=Object.entries(e.indicators||{}).map(([n,v])=>`<span class="chip ${v.estado}">${n}: ${f(v.valor)} · ${v.estado}</span>`).join("");
$("#main").innerHTML=({Inicio:`<div class="grid">${cards.map(c=>`<div class="card"><small>${c[0]}</small><div class="big">${c[1]}</div></div>`).join("")}</div>
<div class="row"><div class="card"><small>NAV (${cur})</small><div id="c1" class="ch"></div></div><div class="card"><small>Distribución por cartera</small><div id="c2" class="ch"></div></div></div>
<h3>Estado de indicadores</h3><div class="card">${ind||"<small>Sin datos</small>"}</div><h3>Aportes y retiradas (W1 ⇄ W2)</h3>${tbl((D.flows||[]).slice().reverse(),["t","tipo","usdc","precio_participacion","participaciones","participaciones_total"])}${e.last_error?`<h3>⚠️ Último error</h3><div class="card">${e.last_error.utc} · ${e.last_error.type}: ${e.last_error.msg}</div>`:""}`,
Operaciones:`<h3>Órdenes</h3>${tbl(D.ops,["signal_date","rule","side","status","size_usdc","qty","px","avg_px","slippage_vs_ref_hl_pct","fee"])}<h3>Ejecuciones (fills)</h3>${tbl(D.fills,["signal_date","rule","fill_n","fill_time_utc","qty","px","fee"])}<p><small>CSV completos en <a style="color:#9339f4" href="data/bot/">/data/bot/</a></small></p>`,
Rendimiento:rend(),Accionistas:accT(),Reglas:`<h3>Reglas · último día evaluado</h3>${tbl(D.rules,["rule","status","detail","dist_pct","decision","reason","cooldown_rest_d"])}`,
"Métricas":`<iframe src="${CFG.METRICAS_URL}"></iframe>`})[tab];
if(tab=="Inicio"){const c1=echarts.init($("#c1"));c1.setOption({grid:{left:55,right:15,top:15,bottom:30},xAxis:{type:"category",data:ser.map(s=>s[0].slice(0,10))},yAxis:{type:"value",scale:true},tooltip:{trigger:"axis"},series:[{type:"line",data:ser.map(s=>s[1]),showSymbol:false,color:"#9339f4",areaStyle:{opacity:.15}}]});
const c2=echarts.init($("#c2")),v=[["W2 Arbitrum/Aave",L.w2_usd],["W3 Hyperliquid",L.w3_usd],["W4 Bitcoin",L.w4_usd]];c2.setOption({tooltip:{},series:[{type:"pie",radius:["45%","70%"],label:{color:"#e6e8f2"},data:v.map(a=>({name:a[0]+(a[1]===""||a[1]==null?" (pendiente)":""),value:+a[1]||0}))}]});charts=[c1,c2]}if(tab=="Rendimiento")chartR();if(tab=="Accionistas")chartA()}

const mean=v=>v.reduce((p,c)=>p+c,0)/v.length,sd=v=>{const m=mean(v);return Math.sqrt(v.reduce((p,c)=>p+(c-m)**2,0)/(v.length-1))};
function daily(){const m={};D.S.forEach(s=>m[s.t.slice(0,10)]=s);return Object.values(m)}
function stats(){const d=daily().filter(s=>+s.share_px>0);if(d.length<31)return null;const r=[],a=[];
for(let i=1;i<d.length;i++){const x=d[i].share_px/d[i-1].share_px-1,y=d[i].btc_px/d[i-1].btc_px-1;r.push(x);a.push(x-y)}
let pk=0,dd=0;d.forEach(s=>{pk=Math.max(pk,+s.share_px);dd=Math.min(dd,s.share_px/pk-1)});const q=Math.sqrt(365),L=d[d.length-1];
return{ret:L.share_px/d[0].share_px-1,btc:L.btc_px/d[0].btc_px-1,vol:sd(r)*q,sharpe:mean(r)/sd(r)*q,ir:mean(a)/sd(a)*q,dd}}
function dca(){const fl=D.flows||[];if(!fl.length)return null;let b=0;fl.forEach(x=>{const t=+new Date(x.t),s=D.S.reduce((p,c)=>Math.abs(+new Date(c.t)-t)<Math.abs(+new Date(p.t)-t)?c:p);b+=+x.usdc/s.btc_px});
const L=D.S[D.S.length-1];return{val:b*L.btc_px,nav:+L.nav_usd}}
function dist(){const o=(D.ops||[]).filter(x=>+x.filled_qty>0),T=s=>o.filter(x=>x.side==s).map(x=>+new Date(x.fill_time_utc||x.placed_utc||x.signal_date)).sort((a,b)=>a-b),
B=T("BUY"),S=T("SELL"),g=a=>a.slice(1).map((v,i)=>(v-a[i])/864e5),bq=o.filter(x=>x.side=="BUY"),q=bq.reduce((p,x)=>p+ +x.filled_qty,0);
return{mb:mean(g(B)),ms:mean(g(S)),pr:B.map((v,i)=>S[i]?(S[i]-v)/864e5:null).filter(x=>x!=null),cm:q?bq.reduce((p,x)=>p+x.avg_px*x.filled_qty,0)/q:null}}
function holders(){const A=D.acc||{},def=A.alias_por_defecto||"Sin asignar",as=A.asignaciones||{},H={},px=+D.S[D.S.length-1].share_px||0;
(D.flows||[]).forEach(x=>{const a=as[x.tx]||def,h=H[a]=H[a]||{s:0,n:0};h.s+=+x.participaciones;h.n+=+x.usdc});const t=Object.values(H).reduce((p,h)=>p+h.s,0);
return Object.entries(H).map(([a,h])=>({alias:a,participaciones:h.s,"%":t?h.s/t*100:0,valor_usd:h.s*px,aportado_neto_usd:h.n,rentabilidad_pct:h.n>0?(h.s*px/h.n-1)*100:null}))}
const cd=(a,b)=>`<div class="card"><small>${a}</small><div class="big">${b}</div></div>`,pc=v=>f(v*100)+" %";
function rend(){const s=stats(),d=dca(),x=dist();return`<div class="grid">${cd("Rentabilidad participación",s?pc(s.ret):"n/d")}${cd("BTC (mismo periodo)",s?pc(s.btc):"n/d")}${cd("Volatilidad anual",s?pc(s.vol):"n/d")}${cd("Sharpe (rf 0)",s?f(s.sharpe):"n/d")}${cd("Information ratio vs BTC",s?f(s.ir):"n/d")}${cd("Máx. drawdown",s?pc(s.dd):"n/d")}</div>${s?"":"<p><small>Sharpe, IR, volatilidad y drawdown necesitan ≥30 días de historial.</small></p>"}
<div class="card"><small>Participación vs BTC (base 100)</small><div id="c3" class="ch"></div></div>
<h3>Comparativa con DCA simple (cada aporte comprado en BTC el día del aporte)</h3><div class="grid">${cd("NAV actual","$ "+f(d&&d.nav))}${cd("DCA de referencia","$ "+f(d&&d.val))}${cd("Diferencia",d?pc(d.nav/d.val-1):"–")}${cd("Coste medio compras bot",x.cm?"$ "+f(x.cm,0):"–")}</div>
<h3>Días entre operaciones</h3><div class="card">Entre compras: media ${f(x.mb)} d · Entre ventas: media ${f(x.ms)} d · 1ª compra→1ª venta, 2ª→2ª…: ${x.pr.length?x.pr.map(v=>f(v,1)).join(" · ")+" d":"–"}</div>`}
function accT(){return`<div class="row"><div>${tbl(holders(),["alias","participaciones","%","valor_usd","aportado_neto_usd","rentabilidad_pct"])}</div><div class="card"><div id="c4" class="ch"></div></div></div><p><small>Alias: edita <code>data/accionistas.json</code> (<code>asignaciones</code>: "tx:índice" → alias, tal como sale en <code>data/flujos.csv</code>). Los aportes sin asignar van a <code>alias_por_defecto</code>.</small></p>`}
function chartR(){const cut=rng?Date.now()-rng*864e5:0,d=daily().filter(s=>+s.share_px>0&&+new Date(s.t)>=cut);if(!d.length)return;const b=d[0],c=echarts.init($("#c3"));
c.setOption({legend:{textStyle:{color:"#8b90ad"}},grid:{left:50,right:15,top:30,bottom:30},tooltip:{trigger:"axis"},xAxis:{type:"category",data:d.map(s=>s.t.slice(0,10))},yAxis:{type:"value",scale:true},
series:[["Participación","share_px","#9339f4"],["BTC","btc_px","#f5b942"]].map(a=>({name:a[0],type:"line",showSymbol:false,color:a[2],data:d.map(s=>+(s[a[1]]/b[a[1]]*100).toFixed(2))}))});charts=[c]}
function chartA(){const c=echarts.init($("#c4"));c.setOption({tooltip:{},series:[{type:"pie",radius:["45%","70%"],label:{color:"#e6e8f2"},data:holders().filter(h=>h.participaciones>0).map(h=>({name:h.alias,value:h.participaciones}))}]});charts=[c]}
function shell(){$("#tabs").innerHTML=["Inicio","Rendimiento","Accionistas","Operaciones","Reglas","Métricas"].map(t=>`<button class="${t==tab?"on":""}" onclick="tab='${t}';shell();draw()">${t}</button>`).join("");
$("#rng").innerHTML=[[7,"7d"],[30,"30d"],[90,"90d"],[365,"1a"],[0,"Todo"]].map(a=>`<button class="${a[0]==rng?"on":""}" onclick="rng=${a[0]};shell();draw()">${a[1]}</button>`).join(" ")}
$("#cur").onclick=()=>{cur=cur=="USD"?"BTC":"USD";$("#cur").textContent=cur;draw()};
load().then(()=>{const e=D.est||{},m=!e.network||e.network=="mainnet";$("#net").className="badge "+(m?"net-m":"net-t");$("#net").textContent=m?"🔴 MAINNET":"🧪 "+e.network.toUpperCase();$("#pair").textContent=e.pair||(e.network?"":"· bot sin datos publicados (testnet)");if(D.demo)$("#demo").classList.remove("hide");shell();draw()});
addEventListener("resize",()=>charts.forEach(c=>c.resize()));
</script></body></html>
